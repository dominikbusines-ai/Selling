<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1ea" />
    <title>Verkaufsliste · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px; background: #f5f1ea; color: #232522; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 360px; }
      h1 { font-size: 28px; line-height: 1.2; }
      a { display: inline-block; padding: 12px 20px; border-radius: 7px; background: #214d40; color: #fffdf9; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Internetverbindung</h1>
      <p>Zum Laden deiner Gegenstände und zum Speichern benötigt die Verkaufsliste eine Internetverbindung.</p>
      <a href="/">Erneut versuchen</a>
    </main>
  </body>
</html>
